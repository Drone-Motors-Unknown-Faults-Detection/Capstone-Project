[build-system]
requires = ["setuptools>=79,<80", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "Drone-Motors-Unknown-Faults-Detection"
version = "0.2.0"
requires-python = ">=3.10,<3.11"
# 冷啟動 PHM 專題（core / experiments / web）的依賴——不需要 TensorFlow 與 GPU
# 版本訂死；完整依賴樹（含間接依賴）由 uv.lock 鎖定，不另外維護 runtime-constraints.txt。
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "hdbscan==0.8.44",
    "loguru==0.7.3",
    "tornado==6.5.10",
    # AI 問答（src/web/assistant.py）：LangGraph 工具呼叫 agent，經 OpenAI 相容 API 連本地 vLLM／llama.cpp
    "langgraph==1.2.12",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
]

[project.optional-dependencies]
# CI 與本機跑 src/tests/、ruff 用；正式執行期不需要
test = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]
# 重跑論文版管線（Ancestor repo）才需要的額外套件：tensorflow 的 numpy 範圍跟上面主依賴
# 衝突，放進 optional-dependencies 會讓 uv.lock 的 universal lock 無解，所以改放純
# requirements 檔，不受 uv.lock 管理；未鎖版，非本輪正式驗證範圍，見 docs/runtime_policy.md。
#   ./scripts/opt/build_uv.sh --legacy   （Ubuntu, GPU；requirements-legacy-linux.txt）

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["core", "experiments", "experiments.health", "web", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["venv", ".venv310", "data"]

[tool.ruff.lint]
# 明確鎖定規則集合：跨 ruff 版本穩定，不隨其「預設集合」改版變動。
select = ["E4", "E7", "E9", "F"]
