<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1120" viewBox="0 0 1060 1120" role="img" aria-labelledby="title desc">
<title id="title">Lineage 健康基準、未知學習與趨勢流程</title><desc id="desc">含正常、邊界、等待、退回和更新失敗分支；趨勢為獨立劇本分析。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#355269"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#18364a} .t{font-size:21px;font-weight:600}.s{font-size:17px}.a{stroke:#355269;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1060" height="1120" fill="#f5f8fa"/><text x="36" y="40" class="t">現有 CSV 展示：未知程度、健康偏離與趨勢分開</text><rect x="36" y="66" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="94" class="t">1. 只有健康 CSV</text><text x="56" y="120" class="s">exp1：train／cal／holdout</text><path d="M330 140 v20" class="a"/><rect x="36" y="160" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="188" class="t">2. 建立健康基準</text><text x="56" y="214" class="s">train 擬合；cal 設95百分位</text><path d="M330 234 v20" class="a"/><rect x="36" y="254" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="282" class="t">3. 輸入新 CSV 視窗</text><text x="56" y="308" class="s">重播／抽樣，非硬體連線</text><path d="M330 328 v20" class="a"/><rect x="36" y="348" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="376" class="t">4. score > 1：未知異常</text><text x="56" y="402" class="s">≤1 正常／已知 → 繼續監測</text><path d="M330 422 v20" class="a"/><rect x="36" y="442" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="470" class="t">5. score > 2：加入隔離區</text><text x="56" y="496" class="s">(1,2] 邊界拒絕，不送分群</text><path d="M330 516 v20" class="a"/><rect x="36" y="536" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="564" class="t">6. 累積與 HDBSCAN</text><text x="56" y="590" class="s">不足／無群／雜訊 → 繼續等待</text><path d="M330 610 v20" class="a"/><rect x="36" y="630" width="590" height="74" rx="10" fill="#fff0cc" stroke="#66869b"/><text x="56" y="658" class="t">7. 候選群 ID：等待確認</text><text x="56" y="684" class="s">至少25筆不保證有群；不顯示答案</text><path d="M330 704 v20" class="a"/><rect x="36" y="724" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="752" class="t">8. 模擬操作員揭示配置</text><text x="56" y="778" class="s">已知邊界 → 退回，模型不增加</text><path d="M330 798 v20" class="a"/><rect x="36" y="818" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="846" class="t">9. 完整標記配置池重擬合</text><text x="56" y="872" class="s">失敗 → 暫停；不能宣稱只學25筆</text><path d="M330 892 v20" class="a"/><rect x="36" y="912" width="590" height="74" rx="10" fill="#e3eef5" stroke="#66869b"/><text x="56" y="940" class="t">10. 更新已知類別／投影版本</text><text x="56" y="966" class="s">繼續監測；學會不代表健康恢復</text><path d="M626 276 H690 V104" class="a"/><rect x="680" y="66" width="345" height="245" rx="12" fill="#e5f3e9" stroke="#698873"/>
<text x="700" y="98" class="t">獨立趨勢分支 exp3</text>
<text x="700" y="136" class="s">EWMA α=.08；CUSUM</text><text x="700" y="169" class="s">中間帶 [.2,.5)，警報線 .5</text>
<text x="700" y="202" class="s">停留≤12筆：突發劇本</text><text x="700" y="235" class="s">A／B串接視窗，非物理磨損</text><text x="700" y="268" class="s">沒有真實時間，不換算秒／壽命</text>
<rect x="680" y="350" width="345" height="358" rx="12" fill="#fff3eb" stroke="#b69275"/>
<text x="700" y="386" class="t">驗證環節與限制</text>
<text x="700" y="426" class="s">LW／kNN：距離與校準</text><text x="700" y="466" class="s">105／75：輸入表示</text>
<text x="700" y="506" class="s">三motor：跨個體比較</text><text x="700" y="546" class="s">exp2：候選、確認、更新</text>
<text x="700" y="586" class="s">稽核：全鏈來源與曝光</text><text x="700" y="626" class="s">raw/session UNKNOWN</text>
<text x="700" y="666" class="s">fresh final INCOMPLETE</text>
<path d="M626 949 H1036 V328 H626" class="a"/>
<text x="700" y="795" class="s">回到新視窗監測</text><text x="36" y="1050" class="s">未知不等病因；分群不等故障類型；T1/T2/T3不是同一顆馬達生命週期。</text>
<text x="36" y="1083" class="s">原稿：研究流程圖.mmd；更新後仍保留完整資料池 oracle 限制。</text></svg>
